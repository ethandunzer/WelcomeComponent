<template>

    <!-- Hero header -->
    <div class="slds-box slds-theme_shade slds-p-around_x-large slds-m-bottom_medium">
        <h1 class="slds-text-heading_large">{greeting}</h1>
        <lwc:if istrue={companyName}>
            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">Your resources, training, and support — all in one place.</p>
        </lwc:if>
    </div>

    <!-- 70/30 outer grid -->
    <div class="slds-grid slds-wrap slds-gutters_medium">

        <!-- Left 70% — inner 50/50 -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
            
            <lightning-card title="Quick Links" icon-name="utility:sparkles">
                <div class="slds-grid slds-gutters_medium slds-p-horizontal_medium slds-p-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <a class="action-tile" href="/lightning/settings/personal/CollaborationEmailSettings/home" target="_blank">
                            <lightning-icon icon-name="standard:email" size="large"></lightning-icon>
                            <span class="action-tile-label">Email Notifications</span>
                        </a>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <a class="action-tile" href="/lightning/settings/personal/LanguageAndTimeZone/home" target="_blank">
                            <lightning-icon icon-name="standard:location" size="large"></lightning-icon>
                            <span class="action-tile-label">Language &amp; Timezones</span>
                        </a>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <a class="action-tile" href="https://opusagency.my.site.com/Support/s/" target="_blank">
                            <lightning-icon icon-name="standard:knowledge" size="large"></lightning-icon>
                            <span class="action-tile-label">IT Support</span>
                        </a>
                    </div>
                </div>
            </lightning-card>

            <div class="slds-grid slds-wrap slds-gutters_medium slds-m-top_medium">

                <!-- Left 50: Getting Started -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-card title="Getting Started" icon-name="utility:sparkles">
                        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                            <template for:each={gettingStartedLinks} for:item="link">
                                <a key={link.label} class="action-tile slds-m-bottom_x-small" href={link.url} target="_blank">
                                    <lightning-icon icon-name={link.iconName} size="small"></lightning-icon>
                                    <span class="action-tile-label">{link.label}</span>
                                    <span class="action-tile-pill">{link.salesforceArea}</span>
                                </a>
                            </template>
                        </div>
                    </lightning-card>
                </div>

                <!-- Right 50: Other Resources -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-card title="Resources &amp; Training" icon-name="utility:apps">
                        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                            <template for:each={trainingLinks} for:item="link">
                                <a key={link.label} class="action-tile slds-m-bottom_x-small" href={link.url} target="_blank">
                                    <lightning-icon icon-name={link.iconName} size="small"></lightning-icon>
                                    <span class="action-tile-label">{link.label}</span>
                                    <span class="action-tile-pill">{link.salesforceArea}</span>
                                </a>
                            </template>
                        </div>
                    </lightning-card>
                </div>

            </div>
        </div>

        <!-- Right 30%: Need Help / Support -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
            <lightning-card title="Need Help?" icon-name="utility:help">
                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                    <template for:each={supportLinks} for:item="link">
                        <a key={link.label} class="action-tile slds-m-bottom_x-small" href={link.url} target="_blank">
                            <lightning-icon icon-name={link.iconName} size="small"></lightning-icon>
                            <span class="action-tile-label">{link.label}</span>
                            <span class="action-tile-pill">{link.salesforceArea}</span>
                        </a>
                    </template>
                </div>
            </lightning-card>
        </div>

    </div>

</template>
